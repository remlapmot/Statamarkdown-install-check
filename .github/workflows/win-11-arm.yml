on:
  # push:
  #   branches: [main, master]
  # pull_request:
  #   branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '31 6 * * TUE' # run on Tuesdays at 6:31 UTC

name: Check-install-win-11-arm

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: windows-11-arm

    name: windows-11-arm

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      R_VERSION: "4.6.1"
      RTOOLS_BUILD: "rtools45-aarch64-6768-6492"

    steps:
      - name: Install R aarch64
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/remlapmot/r-build-for-windows-on-gha/releases/download/R-$env:R_VERSION/R-$env:R_VERSION-aarch64-openblas.exe"
          curl.exe -L -o R-aarch64.exe "$url"
          Start-Process -FilePath R-aarch64.exe -ArgumentList "/install /norestart /verysilent /SUPPRESSMSGBOXES" -NoNewWindow -Wait
          "C:\Program Files\R-aarch64\R-$env:R_VERSION\bin" >> $env:GITHUB_PATH

      - name: Install Rtools45
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/r-hub/rtools45/releases/download/latest/rtools45-aarch64.exe"
          curl.exe -L -o rtools45-aarch64.exe "$url"
          Start-Process -FilePath rtools45-aarch64.exe -ArgumentList "/install /norestart /verysilent /SUPPRESSMSGBOXES" -NoNewWindow -Wait
          "C:\rtools45-aarch64\usr\bin" >> $env:GITHUB_PATH

      # There is no Windows on Arm build of pandoc either, so install the
      # x86_64 zip rather than using choco, whose PATH changes do not reach
      # subsequent steps
      - name: Install pandoc (x86_64)
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GITHUB_PAT" }
          $tag = (Invoke-RestMethod -Uri "https://api.github.com/repos/jgm/pandoc/releases/latest" -Headers $headers).tag_name
          $version = $tag.TrimStart('v')
          $url = "https://github.com/jgm/pandoc/releases/download/$tag/pandoc-$version-windows-x86_64.zip"
          curl.exe -L -o pandoc-win.zip "$url"
          New-Item -ItemType Directory -Force -Path C:\pandoc | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xf pandoc-win.zip -C C:\pandoc
          if ($LASTEXITCODE -ne 0) { throw "Failed to extract pandoc-win.zip" }
          $bin = (Get-ChildItem -Path C:\pandoc -Filter pandoc.exe -Recurse | Select-Object -First 1).DirectoryName
          if (-not $bin) { throw "pandoc.exe not found under C:\pandoc" }
          & "$bin\pandoc.exe" --version
          $bin >> $env:GITHUB_PATH

      # There is no Windows on Arm build of Quarto, so install the x86_64
      # zip and run it under the x64 emulation layer
      - name: Install Quarto (x86_64)
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GITHUB_PAT" }
          $tag = (Invoke-RestMethod -Uri "https://api.github.com/repos/quarto-dev/quarto-cli/releases/latest" -Headers $headers).tag_name
          $version = $tag.TrimStart('v')
          $url = "https://github.com/quarto-dev/quarto-cli/releases/download/$tag/quarto-$version-win.zip"
          curl.exe -L -o quarto-win.zip "$url"
          New-Item -ItemType Directory -Force -Path C:\quarto | Out-Null
          # Use Windows' bsdtar by full path: Rtools is on PATH by this point
          # and its GNU tar cannot extract zip archives
          & "$env:SystemRoot\System32\tar.exe" -xf quarto-win.zip -C C:\quarto
          if ($LASTEXITCODE -ne 0) { throw "Failed to extract quarto-win.zip" }
          $bin = (Get-ChildItem -Path C:\quarto -Filter quarto.exe -Recurse | Select-Object -First 1).DirectoryName
          if (-not $bin) { throw "quarto.exe not found under C:\quarto" }
          & "$bin\quarto.exe" --version
          $bin >> $env:GITHUB_PATH

      - name: Install Statamarkdown and report session info
        run: |
          $ErrorActionPreference = 'Stop'
          Rscript -e "print(R.version); install.packages('Statamarkdown', dependencies = TRUE, repos = c('https://cloud.r-project.org/', 'https://mrcieu.r-universe.dev')); library(Statamarkdown); install.packages('sessioninfo', repos = 'https://cloud.r-project.org/'); sessioninfo::session_info(pkgs = 'installed')"

      - name: Install TinyTeX
        run: |
          $ErrorActionPreference = 'Stop'
          Rscript -e "install.packages(c('tinytex'), repos = 'https://cloud.r-project.org/'); tinytex::install_tinytex(); tinytex::tlmgr(c('option', 'repository', 'https://mirror.ctan.org/systems/texlive/tlnet')); tinytex::tlmgr_install(c('makeindex', 'upquote', 'inconsolata', 'ae', 'parskip', 'hyperref', 'times', 'cm-super', 'tex-gyre'))"
          "C:\Users\runneradmin\AppData\Roaming\TinyTeX\bin\windows" >> $env:GITHUB_PATH

      - name: Clone Statamarkdown and remove installed version
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 https://github.com/Hemken/Statamarkdown.git
          Rscript -e "remove.packages('Statamarkdown')"

      # The released version only suggests rmarkdown, so installing it above
      # does not pull in the development version's dependencies - notably the
      # quarto package, which is its vignette builder. R CMD check --as-cran
      # also errors on any missing Suggests, so install them from the clone.
      - name: Install development version dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          Rscript -e "install.packages('remotes', repos = 'https://cloud.r-project.org/'); remotes::install_deps('Statamarkdown', dependencies = TRUE, repos = 'https://cloud.r-project.org/')"

      - name: Check makeindex
        run: |
          $makeindex = Get-Command makeindex -ErrorAction SilentlyContinue
          if ($makeindex) {
            Write-Host "makeindex found at: $($makeindex.Source)"
          } else {
            Write-Host "makeindex NOT found in PATH"
          }

      - name: R CMD check
        env:
          R_MAKEINDEX: C:\Users\runneradmin\AppData\Roaming\TinyTeX\bin\windows\makeindex.exe
        run: |
          $ErrorActionPreference = 'Stop'
          Rcmd build Statamarkdown
          $tarball = Get-ChildItem -Filter "Statamarkdown_*.tar.gz" | Select-Object -First 1 -ExpandProperty Name
          Rcmd check --as-cran $tarball

      - name: Show check and LaTeX logs
        if: always()
        run: |
          Get-Content Statamarkdown.Rcheck\00check.log -ErrorAction SilentlyContinue
          Get-Content Statamarkdown.Rcheck\Statamarkdown-manual.log -ErrorAction SilentlyContinue
